[package]
name = "reeflog"
version = "0.7.21"
edition = "2021"
description = "Durable local mailbox for Solana events: journal, seal, cursor resume, gap reporting."
license = "MIT"
repository = "https://github.com/auroraxo/reeflog"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
ureq = { version = "3.5.0", features = ["json"] }
# The URL/header domain check calls the CONSUMER's parser — the same `http`
# version ureq and tokio-tungstenite link (one entry in Cargo.lock), so the
# checker cannot drift from the code that will actually deliver.
http = "1"
sha2 = "0.10"
hex = "0.4"
# Account data (`hydrate --account-data`): the RPC answers in base64 and the
# pass stores the bytes it received VERBATIM — decoding to measure exact byte
# length and re-encoding only what was decoded, never a re-encoding by hand.
base64 = "0.22"

[profile.release]
opt-level = 2
